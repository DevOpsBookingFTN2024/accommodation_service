spring.application.name=accommodation_service

#spring.datasource.url=jdbc:postgresql://postgresql-db-accommodation:5432/accommodation_db
spring.datasource.url=jdbc:postgresql://localhost:5432/accommodation_db?useSSL=false
spring.datasource.username=postgres
spring.datasource.password=admin

spring.web.resources.static-locations=file:uploads/

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

user.service.url=http://user-service:8081
reservation.service.url=http://reservation-service:8083
rating.service.url=http://rating-service:8084

server.port=8082


management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.tags.application=accommodation-service
management.server.port=8082
otel.exporter.otlp.endpoint=http://jaeger-collector.monitoring.svc.cluster.local:4317
management.tracing.sampling.probability=1.0

loki.url=http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
logging.level.root=INFO
logging.level.org.springframework.web=INFO
